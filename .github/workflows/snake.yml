name: Update GitHub and GitLab contribution snakes

on:
  workflow_dispatch:
  schedule:
    - cron: '24 5 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snakes
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test collector and generator
        run: npm test

      - name: Generate public GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: markzapxd
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=%2300a58f
            assets/snake-dark.svg?palette=github-dark&color_snake=%2300f5d4

      - name: Generate private GitLab contribution snake
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: npm run snake:generate

      - name: Validate generated SVG animations
        run: npm run snake:validate

      - name: Commit refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg \
            assets/gitlab-snake.svg assets/gitlab-snake-dark.svg
          if git diff --staged --quiet; then
            echo "Contribution snakes are already current"
            exit 0
          fi
          git commit -m "chore: refresh contribution snakes"
          git push
