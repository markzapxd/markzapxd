name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '24 5 * * *'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: markzapxd
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=%2300a58f
            assets/snake-dark.svg?palette=github-dark&color_snake=%2300f5d4

      - name: Commit refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh contribution snake"
            git push
          fi
