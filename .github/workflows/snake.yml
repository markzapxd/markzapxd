name: Update GitLab contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '24 5 * * *'

permissions:
  contents: write

concurrency:
  group: gitlab-contribution-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test collector and generator
        run: npm test

      - name: Generate contribution snake images
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: npm run snake:generate

      - name: Validate generated SVG animations
        run: npm run snake:validate

      - name: Commit refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          if git diff --staged --quiet; then
            echo "Contribution snake is already current"
            exit 0
          fi
          git commit -m "chore: refresh GitLab contribution snake"
          git push
